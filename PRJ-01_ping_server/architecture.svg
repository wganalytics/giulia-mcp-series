<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#833ab4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fd1d1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb045;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#555555;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f4f7f6" />
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">PRJ-01: MCP Ping Server Architecture</text>
  
  <!-- MCP Client (e.g. Claude Desktop) -->
  <rect x="50" y="100" width="200" height="400" rx="10" fill="url(#clientGrad)" filter="url(#shadow)" />
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">MCP Client</text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#ddd" text-anchor="middle">(Claude Desktop / UI)</text>
  
  <rect x="75" y="220" width="150" height="60" rx="5" fill="#fff" />
  <text x="150" y="255" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Call: check_host()</text>

  <rect x="75" y="320" width="150" height="60" rx="5" fill="#fff" />
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Read stdio result</text>

  <!-- STDIO Transport Layer -->
  <text x="350" y="180" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Transport: STDIO (JSON-RPC)</text>
  <line x1="250" y1="200" x2="450" y2="200" stroke="#666" stroke-width="4" stroke-dasharray="8,8" />
  <line x1="450" y1="360" x2="250" y2="360" stroke="#666" stroke-width="4" stroke-dasharray="8,8" />

  <!-- FastMCP Server Layer -->
  <rect x="450" y="100" width="300" height="400" rx="10" fill="#fff" stroke="#833ab4" stroke-width="3" filter="url(#shadow)" />
  <rect x="450" y="100" width="300" height="60" rx="10" fill="url(#mcpGrad)" />
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">FastMCP Server</text>

  <!-- Tools -->
  <rect x="475" y="190" width="250" height="200" rx="5" fill="#fcfcfc" stroke="#ddd" stroke-width="1" />
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Registered Tools</text>
  
  <rect x="500" y="240" width="200" height="40" rx="3" fill="#eef2f5" />
  <text x="600" y="265" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">@mcp.tool() ping</text>

  <rect x="500" y="290" width="200" height="40" rx="3" fill="#eef2f5" />
  <text x="600" y="315" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">@mcp.tool() echo</text>

  <rect x="500" y="340" width="200" height="40" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">@mcp.tool() check_host</text>

  <!-- Target Server Execution -->
  <line x1="725" y1="360" x2="770" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="770" y="340" width="20" height="40" rx="3" fill="#333" />
  <text x="780" y="325" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">TCP</text>

  <!-- Arrow Definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

</svg>
